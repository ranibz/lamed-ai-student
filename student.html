<!DOCTYPE html>
<!-- גרסה: 2.0.2 | תאריך: 2026-05-04 | תיקון אבטחה: ביטול auto-login - תמיד מבקשים ת.ז. מחדש כדי למנוע התחברות לחשבון של תלמיד אחר -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת AI - גרסת תלמיד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #6c5ce7;
    --primary-dark: #5f48d4;
    --bg: #f5f3ff;
    --card: #ffffff;
    --text: #2d3436;
    --text-dim: #636e72;
    --border: #e5e0fa;
    --danger: #e74c3c;
    --success: #00b894;
    --warning: #fdcb6e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    line-height: 1.5;
}
.container { max-width: 640px; margin: 0 auto; }
header {
    text-align: center;
    padding: 24px 16px 20px;
}
header h1 {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--primary);
    margin-bottom: 6px;
}
header h1 .ver {
    font-size: 11px;
    background: rgba(108,92,231,0.12);
    padding: 3px 9px;
    border-radius: 8px;
    font-weight: 700;
    font-family: monospace;
    margin-right: 8px;
    color: var(--primary);
    vertical-align: middle;
}
header p { color: var(--text-dim); font-size: 0.95rem; }
.card {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 4px 14px rgba(108,92,231,0.08);
    margin-bottom: 16px;
}
label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 1rem;
}
input[type="text"], textarea {
    width: 100%;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    transition: border-color 0.2s;
}
textarea {
    min-height: 200px;
    resize: vertical;
}
input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
}
input.id-input {
    text-align: center;
    font-size: 1.4rem;
    letter-spacing: 4px;
    font-weight: 700;
    direction: ltr;
}
.char-counter {
    text-align: left;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 6px;
}
.char-counter.error { color: var(--danger); font-weight: 700; }
.btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    padding: 16px 24px;
    width: 100%;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
    margin-top: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 12px rgba(108,92,231,0.3);
}
.btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(108,92,231,0.4);
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-secondary {
    background: white;
    color: var(--primary);
    border: 2px solid var(--primary);
    padding: 12px 24px;
    box-shadow: none;
}
.btn-secondary:hover:not(:disabled) {
    background: var(--bg);
    box-shadow: none;
}
.error-msg {
    background: #ffe0e0;
    color: var(--danger);
    padding: 12px 14px;
    border-radius: 10px;
    margin-top: 12px;
    font-weight: 500;
    font-size: 0.95rem;
}
.info-bar {
    background: linear-gradient(135deg, #e8e3fc, #f3eefe);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}
.info-bar .greeting {
    font-weight: 700;
    color: var(--primary);
    font-size: 0.95rem;
}
.info-bar .usage {
    font-size: 0.85rem;
    color: var(--text-dim);
}
.info-bar .usage strong {
    color: var(--primary);
    font-size: 1rem;
}
.btn-logout {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
}
.btn-logout:hover { background: var(--border); }
.loading-card {
    text-align: center;
    padding: 40px 20px;
    display: none;
}
.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-dim); font-weight: 500; }
.result-card {
    text-align: center;
    padding: 36px 24px;
    border-radius: 16px;
    margin-bottom: 16px;
    display: none;
}
.result-card.human { background: linear-gradient(135deg, #00b894, #55efc4); color: white; }
.result-card.mixed { background: linear-gradient(135deg, #fdcb6e, #ffeaa7); color: #2d3436; }
.result-card.ai { background: linear-gradient(135deg, #e17055, #fab1a0); color: white; }
.result-card.definitely_ai { background: linear-gradient(135deg, #d63031, #fab1a0); color: white; }
.result-card .verdict-icon { font-size: 64px; margin-bottom: 8px; }
.result-card .verdict-text { font-size: 1.6rem; font-weight: 900; margin-bottom: 16px; }
.result-card .ai-likelihood {
    font-size: 5rem;
    font-weight: 900;
    line-height: 1;
    margin: 8px 0;
}
.result-card .ai-likelihood-label {
    font-size: 1rem;
    opacity: 0.9;
    font-weight: 500;
}
footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    padding: 16px 8px;
    margin-top: 8px;
}
</style>
</head>
<body>
<div class="container">

<header>
    <h1>בדיקת AI <span class="ver">v2.0.2</span></h1>
    <p>מערכת זיהוי כתיבת AI לתלמידי תקשורת</p>
</header>

<!-- מסך כניסה -->
<div id="loginCard" class="card">
    <label for="idInput">תעודת זהות</label>
    <input type="text" id="idInput" class="id-input" placeholder="הקלד 9 ספרות" maxlength="9" inputmode="numeric" pattern="[0-9]*">
    <button class="btn" id="loginBtn" onclick="login()">כניסה</button>
    <div id="loginError"></div>
</div>

<!-- מסך ראשי (אחרי כניסה) -->
<div id="mainScreen" style="display:none;">
    <div class="info-bar">
        <div>
            <div class="greeting" id="greeting">שלום</div>
            <div class="usage">בדיקות שנותרו היום: <strong id="remainingCount">3</strong></div>
        </div>
        <button class="btn-logout" onclick="logout()">יציאה</button>
    </div>

    <div id="inputCard" class="card">
        <label for="text">הטקסט לבדיקה</label>
        <textarea id="text" placeholder="הדבק כאן את הטקסט (לפחות 50 תווים, עד 10,000)..." oninput="updateCounter()"></textarea>
        <div id="charCounter" class="char-counter">0 / 10,000 תווים</div>
        <button class="btn" id="analyzeBtn" onclick="analyzeText()">נתח את הטקסט</button>
        <div id="errorMsg"></div>
    </div>

    <div id="loadingCard" class="loading-card card">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">המערכת מנתחת את הטקסט...</div>
    </div>

    <div id="resultCard" class="result-card">
        <div class="verdict-icon" id="verdictIcon">🤔</div>
        <div class="verdict-text" id="verdictText"></div>
        <div class="ai-likelihood" id="aiLikelihood">0%</div>
        <div class="ai-likelihood-label">סיכוי שהטקסט נכתב על ידי AI</div>
    </div>
    <button id="resetBtn" class="btn btn-secondary" style="display:none;" onclick="reset()">בדוק טקסט נוסף</button>
</div>

<footer>
    מערכת בדיקת AI · בית חינוך גליל מערבי
</footer>

</div>

<script>
const MIN_LENGTH = 50;
const MAX_LENGTH = 10000;
const STORAGE_KEY = 'lamed_student_session';

const VERDICT_INFO = {
    'human':         { icon: '✅',  text: 'הטקסט נראה אנושי' },
    'mixed':         { icon: '⚠️',  text: 'יש סימנים מעורבים' },
    'ai':            { icon: '🤖',  text: 'יש סימנים חזקים ל-AI' },
    'definitely_ai': { icon: '🚫',  text: 'הטקסט נראה כתוב על ידי AI' }
};

let currentSession = null;

// ============= אתחול =============
window.addEventListener('DOMContentLoaded', () => {
    // v2.0.2: ביטול auto-login - תמיד מבקשים ת.ז. מחדש
    // מנקים גם sessions ישנים שאולי נשמרו
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    document.getElementById('idInput').focus();
});

// סינון להזנת ספרות בלבד
document.getElementById('idInput').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
});

// כניסה ב-Enter
document.getElementById('idInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
});

// ============= פונקציות כניסה =============
async function autoLogin(id_number) {
    // ננסה להתחבר עם הת.ז. השמורה - אם זה לא עובד, נציג מסך כניסה
    const success = await doLogin(id_number, true);
    if (!success) {
        clearSession();
        document.getElementById('idInput').focus();
    }
}

async function login() {
    const id = document.getElementById('idInput').value.trim();
    if (!id || id.length < 7) {
        showLoginError('אנא הזן תעודת זהות תקינה (9 ספרות)');
        return;
    }
    await doLogin(id, false);
}

async function doLogin(id_number, isAuto) {
    if (!isAuto) {
        document.getElementById('loginBtn').disabled = true;
        document.getElementById('loginBtn').textContent = 'מתחבר...';
        clearLoginError();
    }

    try {
        const res = await fetch('/.netlify/functions/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_number })
        });

        const data = await res.json();

        if (!res.ok || !data.authorized) {
            if (!isAuto) showLoginError(data.error || 'שגיאה בהתחברות');
            return false;
        }

        // התחברות הצליחה
        currentSession = data;
        // v2.0.2: לא שומרים session ב-localStorage (מניעת התחברות לחשבון של תלמיד אחר)
        showMainScreen();
        return true;

    } catch (err) {
        console.error(err);
        if (!isAuto) showLoginError('שגיאת רשת - נסה שוב');
        return false;
    } finally {
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').textContent = 'כניסה';
    }
}

function saveSession(id_number) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            id_number,
            date: new Date().toDateString()
        }));
    } catch (e) {}
}

function clearSession() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    currentSession = null;
}

function logout() {
    if (!confirm('האם להתנתק?')) return;
    clearSession();
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('idInput').value = '';
    document.getElementById('idInput').focus();
}

function showMainScreen() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';

    const greeting = currentSession.full_name 
        ? `שלום, ${currentSession.full_name}` 
        : 'שלום';
    document.getElementById('greeting').textContent = greeting;
    
    updateRemainingDisplay();
    updateCounter();
}

function updateRemainingDisplay() {
    const remaining = currentSession?.remaining ?? 0;
    document.getElementById('remainingCount').textContent = remaining;
    
    // אם נגמרו - השבת את כפתור הניתוח
    const btn = document.getElementById('analyzeBtn');
    if (remaining <= 0) {
        btn.disabled = true;
        btn.textContent = 'הגעת למקסימום היומי';
    } else {
        btn.disabled = false;
        btn.textContent = 'נתח את הטקסט';
    }
}

function showLoginError(msg) {
    document.getElementById('loginError').innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

function clearLoginError() {
    document.getElementById('loginError').innerHTML = '';
}

// ============= פונקציות ניתוח =============
function updateCounter() {
    const text = document.getElementById('text').value;
    const counter = document.getElementById('charCounter');
    const len = text.length;
    counter.textContent = `${len.toLocaleString('he-IL')} / 10,000 תווים`;
    counter.classList.remove('error');
    if (len > MAX_LENGTH) counter.classList.add('error');
    else if (len > 0 && len < MIN_LENGTH) counter.classList.add('error');
}

function showError(msg) {
    document.getElementById('errorMsg').innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

function clearError() {
    document.getElementById('errorMsg').innerHTML = '';
}

async function analyzeText() {
    if (!currentSession || !currentSession.id_number) {
        alert('פג תוקף ההתחברות - יש להתחבר מחדש');
        logout();
        return;
    }

    clearError();
    const text = document.getElementById('text').value.trim();

    if (text.length < MIN_LENGTH) {
        showError(`הטקסט קצר מדי - יש להזין לפחות ${MIN_LENGTH} תווים`);
        return;
    }
    if (text.length > MAX_LENGTH) {
        showError(`הטקסט ארוך מדי - מקסימום ${MAX_LENGTH} תווים`);
        return;
    }

    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('loadingCard').style.display = 'block';

    const loadingMessages = [
        'המערכת מנתחת את הטקסט...',
        'מזהה דפוסי כתיבה...',
        'משווה לסגנון AI...',
        'כמעט סיימנו...'
    ];
    let msgIdx = 0;
    const loadingInterval = setInterval(() => {
        msgIdx = (msgIdx + 1) % loadingMessages.length;
        document.getElementById('loadingText').textContent = loadingMessages[msgIdx];
    }, 1500);

    try {
        const res = await fetch('/.netlify/functions/analyze-light', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                text,
                id_number: currentSession.id_number 
            })
        });

        const data = await res.json();
        clearInterval(loadingInterval);

        if (!res.ok) {
            // אם הת.ז. לא מורשית או הסתיימו השימושים
            if (res.status === 403 || res.status === 401) {
                alert(data.error || 'אין הרשאה');
                logout();
                return;
            }
            if (res.status === 429) {
                // הגיע למגבלה
                document.getElementById('loadingCard').style.display = 'none';
                document.getElementById('inputCard').style.display = 'block';
                if (data.used_today !== undefined) {
                    currentSession.used_today = data.used_today;
                    currentSession.remaining = 0;
                }
                updateRemainingDisplay();
                showError(data.error);
                return;
            }
            throw new Error(data.error || 'שגיאה בניתוח');
        }

        // עדכון מונה השימושים
        if (data.remaining !== undefined) {
            currentSession.remaining = data.remaining;
            currentSession.used_today = data.used_today;
        }

        displayResult(data);

        if (data._version) {
            console.log(`✓ נותח ע"י analyze-light v${data._version} (${data._duration_ms}ms) | בדיקות נותרו: ${data.remaining}`);
        }
    } catch (err) {
        clearInterval(loadingInterval);
        console.error(err);
        document.getElementById('loadingCard').style.display = 'none';
        document.getElementById('inputCard').style.display = 'block';
        showError(err.message || 'שגיאה לא צפויה - אנא נסה שוב');
    }
}

function displayResult(data) {
    document.getElementById('loadingCard').style.display = 'none';

    const verdict = data.verdict || 'mixed';
    const likelihood = Math.max(0, Math.min(100, Math.round(data.ai_likelihood || 0)));
    const info = VERDICT_INFO[verdict] || VERDICT_INFO['mixed'];

    const card = document.getElementById('resultCard');
    card.className = 'result-card ' + verdict;
    card.style.display = 'block';

    document.getElementById('verdictIcon').textContent = info.icon;
    document.getElementById('verdictText').textContent = info.text;

    let current = 0;
    const target = likelihood;
    const el = document.getElementById('aiLikelihood');
    const step = Math.max(1, Math.ceil(target / 30));
    const animInterval = setInterval(() => {
        current += step;
        if (current >= target) {
            current = target;
            clearInterval(animInterval);
        }
        el.textContent = current + '%';
    }, 25);

    document.getElementById('resetBtn').style.display = 'block';
    updateRemainingDisplay();
}

function reset() {
    document.getElementById('text').value = '';
    updateCounter();
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('inputCard').style.display = 'block';
    document.getElementById('text').focus();
}
</script>

</body>
</html>
